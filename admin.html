<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭлектроМаркет — админка</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px Arial;background:#f2f5f9;color:#172235}
header{background:#101a2b;color:white;padding:18px}
main{max-width:1000px;margin:auto;padding:14px}
.panel{background:white;border:1px solid #dbe3ed;border-radius:12px;padding:14px;margin:12px 0}
button{border:0;border-radius:8px;padding:11px 14px;background:#1769d2;color:white;font-weight:bold;margin:4px}
.gray{background:#e4eaf2;color:#172235}
.red{background:#b42318}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}
input,textarea,select{width:100%;padding:11px;border:1px solid #bdc9d8;border-radius:8px;font:inherit}
textarea{min-height:80px}
.help{font-size:12px;color:#64748b}
.status{padding:10px 0;overflow-wrap:anywhere}
.item{background:white;border:1px solid #dbe3ed;border-radius:8px;padding:10px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item img{width:55px;height:55px;object-fit:contain}
.info{flex:1;min-width:120px}
.info small{display:block;color:#64748b;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
#photoPreview{display:none;max-width:180px;max-height:180px;object-fit:contain}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h2>ЭлектроМаркет — каталог</h2>
Панель управления товарами
</header>
<main>
<section class="panel">
<h3>Подключение GitHub</h3>
<label for="token">GitHub access token</label>
<input id="token" type="password" autocomplete="off"
placeholder="Вставьте токен GitHub">
<p class="help">Токен не отправляйте другим людям.</p>
<button id="connect" type="button">Подключить</button>
<button id="disconnect" class="gray" type="button">Отключить</button>
</section>

<div>
<button id="new" type="button">+ Новый товар</button>
<button id="reload" class="gray" type="button">Обновить каталог</button>
</div>

<label for="search">Поиск товара</label>
<input id="search" placeholder="Название, бренд или категория">
<div id="status" class="status">Загрузка каталога…</div>

<section class="panel">
<h3>Товары (<span id="count">0</span>)</h3>
<div id="list"></div>
</section>

<section class="panel">
<h3 id="formTitle">Новый товар</h3>
<form id="form">
<div class="grid">
<div class="full">
<label for="name">Название товара *</label>
<input id="name" required>
</div>
<div>
<label for="brand">Бренд</label>
<input id="brand">
</div>
<div>
<label for="category">Категория *</label>
<select id="category" required></select>
</div>
<div>
<label for="price">Цена, ₽ *</label>
<input id="price" type="number" min="0" required>
</div>
<div>
<label for="oldPrice">Старая цена, ₽</label>
<input id="oldPrice" type="number" min="0">
</div>
<div>
<label for="badge">Метка</label>
<input id="badge" placeholder="АКЦИЯ">
</div>
<div>
<label for="emoji">Значок</label>
<input id="emoji" placeholder="📦">
</div>
<div class="full">
<label for="photoFile">Фотография товара</label>
<input id="photoFile" type="file" accept="image/*">
<img id="photoPreview" alt="Предпросмотр">
<label for="image">Имя файла или URL фото</label>
<input id="image" placeholder="images/photo.jpg">
</div>
<div class="full">
<label for="description">Описание</label>
<textarea id="description"></textarea>
</div>
</div>
<button id="save" type="submit">Сохранить товар</button>
<button id="clear" class="gray" type="button">Очистить форму</button>
</form>
</section>
