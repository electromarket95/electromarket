<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭлектроМаркет — админка</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px Arial;background:#f2f5f9;color:#172235}
header{background:#101a2b;color:white;padding:18px}
main{max-width:1000px;margin:auto;padding:14px}
.panel{background:white;border:1px solid #dbe3ed;border-radius:12px;padding:14px;margin:12px 0}
button{border:0;border-radius:8px;padding:11px 14px;background:#1769d2;color:white;font-weight:bold;margin:4px}
.gray{background:#e4eaf2;color:#172235}
.red{background:#b42318}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}
input,textarea,select{width:100%;padding:11px;border:1px solid #bdc9d8;border-radius:8px;font:inherit}
textarea{min-height:80px}
.help{font-size:12px;color:#64748b}
.status{padding:10px 0;overflow-wrap:anywhere}
.item{background:white;border:1px solid #dbe3ed;border-radius:8px;padding:10px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item img{width:55px;height:55px;object-fit:contain}
.info{flex:1;min-width:120px}
.info small{display:block;color:#64748b;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
#photoPreview{display:none;max-width:180px;max-height:180px;object-fit:contain}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h2>ЭлектроМаркет — каталог</h2>
Панель управления товарами
</header>
<main>
<section class="panel">
<h3>Подключение GitHub</h3>
<label for="token">GitHub access token</label>
<input id="token" type="password" autocomplete="off"
placeholder="Вставьте токен GitHub">
<p class="help">Токен не отправляйте другим людям.</p>
<button id="connect" type="button">Подключить</button>
<button id="disconnect" class="gray" type="button">Отключить</button>
</section>

<div>
<button id="new" type="button">+ Новый товар</button>
<button id="reload" class="gray" type="button">Обновить каталог</button>
</div>

<label for="search">Поиск товара</label>
<input id="search" placeholder="Название, бренд или категория">
<div id="status" class="status">Загрузка каталога…</div>

<section class="panel">
<h3>Товары (<span id="count">0</span>)</h3>
<div id="list"></div>
</section>

<section class="panel">
<h3 id="formTitle">Новый товар</h3>
<form id="form">
<div class="grid">
<div class="full">
<label for="name">Название товара *</label>
<input id="name" required>
</div>
<div>
<label for="brand">Бренд</label>
<input id="brand">
</div>
<div>
<label for="category">Категория *</label>
<select id="category" required></select>
</div>
<div>
<label for="price">Цена, ₽ *</label>
<input id="price" type="number" min="0" required>
</div>
<div>
<label for="oldPrice">Старая цена, ₽</label>
<input id="oldPrice" type="number" min="0">
</div>
<div>
<label for="badge">Метка</label>
<input id="badge" placeholder="АКЦИЯ">
</div>
<div>
<label for="emoji">Значок</label>
<input id="emoji" placeholder="📦">
</div>
<div class="full">
<label for="photoFile">Фотография товара</label>
<input id="photoFile" type="file" accept="image/*">
<img id="photoPreview" alt="Предпросмотр">
<label for="image">Имя файла или URL фото</label>
<input id="image" placeholder="images/photo.jpg">
</div>
<div class="full">
<label for="description">Описание</label>
<textarea id="description"></textarea>
</div>
</div>
<button id="save" type="submit">Сохранить товар</button>
<button id="clear" class="gray" type="button">Очистить форму</button>
</form>
</section>
</main>

<script>
const REPO = "electromarket95/electromarket";
const BRANCH = "main";
const BASE = "https://electromarket95.github.io/electromarket/";
const CATS = [
  "Смартфоны и телефоны", "Аксессуары",
  "Планшеты и компьютеры", "Электроинструменты",
  "Бытовая техника", "Роутеры и связь",
  "Кондиционеры и отопление", "Смарт-гаджеты и сеть",
  "Автотовары и электроника",
"Машинки для стрижки",
  "Прочее"
];

let token = localStorage.getItem("em_admin_token") || "";
let products = [];
let fileSha = "";
let editIndex = -1;
let photoData = "";

const $ = id => document.getElementById(id);
const status = msg => $("status").textContent = msg;

if (token) $("token").value = token;

function headers() {
  return {
    Authorization: "Bearer " + token,
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
}

function decode64(s) {
  const bytes = Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function encode64(s) {
  const bytes = new TextEncoder().encode(s);
  let binary = "";
  for (let i = 0; i < bytes.length; i += 8192) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
  }
  return btoa(binary);
}

async function githubFile(path) {
  const r = await fetch(
    `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`,
    { headers: headers(), cache: "no-store" }
  );
  const data = await r.json();
  if (!r.ok) throw new Error(data.message || "GitHub: " + r.status);
  return data;
}

async function loadProducts() {
  const file = await githubFile("products.js");
  fileSha = file.sha;
  const source = decode64(file.content);
  const match = source.match(/window\.PRODUCTS\s*=\s*([\s\S]*?)\s*;?\s*$/);
  if (!match) throw new Error("Не удалось прочитать массив window.PRODUCTS");
  const data = JSON.parse(match[1]);
  if (!Array.isArray(data)) throw new Error("Каталог товаров имеет неверный формат");
  products = data;
}

function imageUrl(path) {
  if (!path) return "";
  if (/^(https?:|data:|blob:)/i.test(path)) return path;
  return BASE + path.split("/").map(encodeURIComponent).join("/");
}

function fillCategories(selected = "") {
  const all = [...new Set([
    ...CATS, ...products.map(p => p.category).filter(Boolean)
  ])];
  $("category").innerHTML = "";
  all.forEach(c => {
    const o = document.createElement("option");
    o.value = c;
    o.textContent = c;
    $("category").appendChild(o);
  });
  if (selected) $("category").value = selected;
}

function render() {
  fillCategories($("category").value);
  const query = $("search").value.trim().toLowerCase();
  const list = $("list");
  list.innerHTML = "";
  let shown = 0;

  products.forEach((p, i) => {
    if (![p.name, p.brand, p.category].join(" ").toLowerCase().includes(query)) return;
    shown++;

    const item = document.createElement("div");
    item.className = "item";

    if (p.image) {
      const img = document.createElement("img");
      img.src = imageUrl(p.image);
      img.alt = "";
      img.onerror = () => { img.style.display = "none"; };
      item.appendChild(img);
    }

    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("strong");
    name.textContent = p.name || "Без названия";
    const detail = document.createElement("small");
    detail.textContent = `${p.category || "Без категории"} · ${p.price ?? "—"} ₽`;
    info.append(name, detail);

    const edit = document.createElement("button");
    edit.textContent = "Изменить";
    edit.onclick = () => editProduct(i);

    const del = document.createElement("button");
    del.textContent = "Удалить";
    del.className = "red";
    del.onclick = async () => {
      if (!confirm(`Удалить товар «${p.name || ""}»?`)) return;
      products.splice(i, 1);
      await saveProducts();
    };

    item.append(info, edit, del);
    list.appendChild(item);
  });

  $("count").textContent = products.length;
  if (!shown) list.textContent = "Товары не найдены.";
}

async function connect() {
  if ($("token").value.trim()) token = $("token").value.trim();
  if (!token) {
    status("Вставь GitHub-токен.");
    return;
  }

  $("connect").disabled = true;
  status("Подключение к GitHub…");

  try {
    await loadProducts();
    localStorage.setItem("em_admin_token", token);
    render();
    status("Подключено. Товаров: " + products.length);
  } catch (e) {
    status("Ошибка подключения: " + e.message);
  } finally {
    $("connect").disabled = false;
  }
}

async function uploadPhoto(path, dataUrl) {
  const comma = dataUrl.indexOf(",");
  if (comma < 0) throw new Error("Не удалось прочитать фото");
  const content = dataUrl.slice(comma + 1);

  let sha;
  try {
    sha = (await githubFile(path)).sha;
  } catch (e) {
    if (!String(e.message).toLowerCase().includes("not found")) throw e;
  }

  const body = {
    message: "Добавление фотографии товара",
    branch: BRANCH,
    content
  };
  if (sha) body.sha = sha;

  const r = await fetch(
    `https://api.github.com/repos/${REPO}/contents/${path}`,
    {
      method: "PUT",
      headers: { ...headers(), "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }
  );
  const result = await r.json();
  if (!r.ok) throw new Error(result.message || "Не удалось загрузить фото");
  return path;
}

async function saveProducts() {
  if (!token) {
    status("Сначала подключи GitHub.");
    return;
  }

  $("save").disabled = true;
  try {
    status("Сохраняю каталог…");

    // Получаем SHA файла, не затирая редактируемые товары.
    const current = await githubFile("products.js");
    fileSha = current.sha;

    const body = {
      message: "Обновление каталога ЭлектроМаркет",
      branch: BRANCH,
      sha: fileSha,
      content: encode64(
        "window.PRODUCTS = " + JSON.stringify(products, null, 2) + ";\n"
      )
    };

    const r = await fetch(
      `https://api.github.com/repos/${REPO}/contents/products.js`,
      {
        method: "PUT",
        headers: { ...headers(), "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }
    );
    const result = await r.json();
    if (!r.ok) throw new Error(result.message || "Ошибка записи каталога");

    fileSha = result.content.sha;
    render();
    status("Каталог успешно сохранён в GitHub.");
  } catch (e) {
    status("Ошибка сохранения: " + e.message);
  } finally {
    $("save").disabled = false;
  }
}

function clearForm() {
  $("form").reset();
  editIndex = -1;
  photoData = "";
  $("photoPreview").style.display = "none";
  $("formTitle").textContent = "Новый товар";
  $("save").textContent = "Сохранить товар";
  fillCategories();
}

function editProduct(i) {
  const p = products[i];
  editIndex = i;
  photoData = "";
  $("name").value = p.name || "";
  $("brand").value = p.brand || "";
  $("price").value = p.price ?? "";
  $("oldPrice").value = p.oldPrice ?? "";
  $("badge").value = p.badge || "";
  $("emoji").value = p.emoji || "";
  $("image").value = p.image || "";
  $("description").value = p.description || "";
  fillCategories(p.category || "");
  $("formTitle").textContent = "Редактирование товара";
  $("save").textContent = "Сохранить изменения";

  if (p.image) {
    $("photoPreview").src = imageUrl(p.image);
    $("photoPreview").style.display = "block";
  } else {
    $("photoPreview").style.display = "none";
  }
  $("formTitle").scrollIntoView({ behavior: "smooth" });
}

$("connect").addEventListener("click", connect);
$("reload").addEventListener("click", connect);

$("disconnect").addEventListener("click", () => {
  token = "";
  localStorage.removeItem("em_admin_token");
  $("token").value = "";
  status("Отключено.");
});

$("search").addEventListener("input", render);
$("new").addEventListener("click", () => {
  clearForm();
  $("formTitle").scrollIntoView({ behavior: "smooth" });
});
$("clear").addEventListener("click", clearForm);

$("photoFile").addEventListener("change", () => {
  const file = $("photoFile").files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    status("Выбери изображение.");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    photoData = reader.result;
    $("photoPreview").src = photoData;
    $("photoPreview").style.display = "block";
  };
  reader.onerror = () => status("Не удалось прочитать фото.");
  reader.readAsDataURL(file);
});

$("form").addEventListener("submit", async e => {
  e.preventDefault();

  const name = $("name").value.trim();
  if (!name || $("price").value === "" || Number($("price").value) < 0) {
    status("Заполни название и корректную цену.");
    return;
  }

  const previous = editIndex >= 0 ? products[editIndex] : {};
  const product = {
    ...previous,
    id: previous.id || "item-" + Date.now(),
    name,
    brand: $("brand").value.trim(),
    category: $("category").value,
    price: Number($("price").value),
    oldPrice: $("oldPrice").value ? Number($("oldPrice").value) : 0,
    badge: $("badge").value.trim(),
    emoji: $("emoji").value.trim(),
    image: $("image").value.trim() || previous.image || "",
    description: $("description").value.trim()
  };

  try {
    if (photoData) {
      const file = $("photoFile").files[0];
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const safeExt = ["jpg", "jpeg", "png", "webp"].includes(ext) ? ext : "jpg";
      const path = "images/" + product.id + "." + safeExt;
      status("Загружаю фотографию…");
      product.image = await uploadPhoto(path, photoData);
    }

    if (editIndex >= 0) products[editIndex] = product;
    else products.unshift(product);

    await saveProducts();
    clearForm();
  } catch (error) {
    status("Ошибка: " + error.message);
  }
});

fillCategories();
render();

if (token) {
  connect();
} else {
  status("Вставь GitHub-токен и нажми «Подключить».");
}
</script>    
</body>
</html>
